{% extends "base.html" %}
{% block content %}
<h2>Список учеников</h2>

{% if students %}
<table class="table table-hover table-bordered">
  <thead class="table-light">
    <tr>
      <th>#</th>
      <th>Имя</th>
      <th>Предмет</th>
      <th>Оценка</th>
      <th>Действие</th>
    </tr>
  </thead>
  <tbody>
    {% for s in students %}
    <tr>
      <td>{{ loop.index }}</td>
      <td>{{ s.name }}</td>
      <td>{{ s.subject }}</td>
      <td>{{ s.grade }}</td>
      <td>
        <a href="{{ url_for('delete_student', index=loop.index0) }}" class="btn btn-sm btn-danger"
           onclick="return confirm('Удалить ученика {{ s.name }}?')">Удалить</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<div class="alert alert-info">Список учеников пуст</div>
{% endif %}

<a href="{{ url_for('add_student') }}" class="btn btn-success">Добавить ученика</a>
{% endblock %}
