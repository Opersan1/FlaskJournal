<!DOCTYPE html>
<html lang="ru">
<head><!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <meta charset="UTF-8">
    <title>Электронный журнал</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('index') }}">Журнал</a>
    <div>
      {% if session.get('user') %}
        <span class="text-white me-3">{{ session['user']['username'] }} ({{ session['user']['role'] }})</span>
        <a class="btn btn-outline-light btn-sm" href="{{ url_for('logout') }}">Выйти</a>
      {% else %}
        <a class="btn btn-outline-light btn-sm" href="{{ url_for('login') }}">Вход</a>
        <a class="btn btn-outline-light btn-sm" href="{{ url_for('register') }}">Регистрация</a>
      {% endif %}
    </div>
  </div>
</nav>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

</body>
</html>
